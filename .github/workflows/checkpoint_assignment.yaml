name: CI/CD Pipeline for Checkpoint Assignment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Debug paths
      run: |
          pwd
          ls -R terraform

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.1.7"

    - name: Setting environment variables
      run: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform init
      run: terraform init
      working-directory: ./prod

    - name: Terraform plan
      run: terraform plan 
      working-directory: ./prod

    - name: Terraform apply
      id: terraform-apply
      run: terraform apply -auto-approve
      working-directory: ./prod

  run-script:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
       - uses: actions/checkout@v4
       - name: 'Running dummyjson script'
         run: python3 ./dummyjson.py
         working-directory: .